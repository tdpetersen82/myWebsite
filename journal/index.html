<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Journal</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14161b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Journal">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #14161b;
    --panel: #1c1f26;
    --panel-2: #232733;
    --line: #2e3341;
    --text: #e8eaf0;
    --dim: #9aa2b4;
    --faint: #6b7386;
    --accent: #e0a458;
    --danger: #e06a5c;
    --ok: #6cc08b;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: none;
  }

  body { min-height: 100dvh; }

  /* ---------- passphrase gate ---------- */

  #gate {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #gate.hidden { display: none; }

  .gate-card { width: 100%; max-width: 340px; text-align: center; }
  .gate-card h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 6px; }
  .gate-card p { color: var(--dim); font-size: 0.9rem; margin: 0 0 20px; line-height: 1.5; }

  .gate-card input {
    width: 100%;
    padding: 14px 16px;
    font-size: 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text);
    margin-bottom: 12px;
  }
  .gate-card input:focus { outline: none; border-color: var(--accent); }

  .gate-card button {
    width: 100%;
    padding: 14px;
    font-size: 1rem;
    font-weight: 600;
    background: var(--accent);
    color: #1a1208;
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }
  #gate-error { color: var(--danger); font-size: 0.85rem; min-height: 1.2em; margin-top: 10px; }

  /* ---------- shell ---------- */

  #app { display: none; flex-direction: column; min-height: 100dvh; }
  #app.ready { display: flex; }

  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(20, 22, 27, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    padding: calc(var(--safe-top) + 10px) 12px 10px;
  }

  .datebar { display: flex; align-items: center; gap: 8px; }

  .navbtn {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 1.1rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .navbtn:disabled { opacity: 0.3; cursor: default; }

  .datelabel { flex: 1 1 auto; text-align: center; min-width: 0; position: relative; }
  .datelabel .d1 { font-size: 1.05rem; font-weight: 600; letter-spacing: -0.01em; }
  .datelabel .d2 { font-size: 0.75rem; color: var(--faint); margin-top: 2px; }
  .datelabel .caret { color: var(--faint); font-size: 0.7em; margin-left: 5px; vertical-align: middle; }

  /* Transparent date input laid over the whole label: tapping the date opens
     the OS picker, so any past day is one tap away instead of N taps on the
     arrow. font-size 16px keeps iOS from zooming the page on focus. */
  #date-picker {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    border: none;
    background: transparent;
    color: transparent;
    opacity: 0;
    font-size: 16px;
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
  }

  .statusrow {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 8px;
    font-size: 0.72rem;
    color: var(--faint);
    min-height: 22px;
  }

  /* "Today" is navigation, so it lives with the date nav rather than among the
     content actions — and only appears when you're actually away from today.
     Absolutely positioned so it can't shove the status text off centre. */
  .today-chip {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    padding: 4px 12px;
    font: inherit;
    font-size: 0.72rem;
    font-weight: 600;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--accent);
    cursor: pointer;
  }
  .today-chip[hidden] { display: none; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
  .dot.ok { background: var(--ok); }
  .dot.busy { background: var(--accent); }
  .dot.off { background: var(--danger); }

  /* ---------- editor ---------- */

  main { flex: 1 1 auto; padding: 14px 12px calc(var(--safe-bottom) + 24px); }

  /* Auto-growing textarea with no JS measurement. A hidden pseudo-element
     mirrors the text into the same grid cell, so the grid tracks the content
     and the textarea stretches to fill it. This sidesteps the scrollHeight
     feedback loop (scrollHeight never reports less than the element's own box,
     so one oversized reading would stick permanently). field-sizing: content
     would do this natively but Safari doesn't support it yet. */
  .grow-wrap { display: grid; }
  .grow-wrap::after {
    content: attr(data-value) " ";
    white-space: pre-wrap;
    word-break: break-word;
    visibility: hidden;
  }
  .grow-wrap > textarea { resize: none; overflow: hidden; }
  .grow-wrap > textarea,
  .grow-wrap::after {
    grid-area: 1 / 1 / 2 / 2;
    width: 100%;
    min-height: 180px;
    padding: 14px;
    font: inherit;
    font-size: 16px;
    line-height: 1.6;
    border: 1px solid transparent;
    border-radius: 14px;
    box-sizing: border-box;
  }
  #editor {
    background: var(--panel);
    border-color: var(--line);
    color: var(--text);
  }
  #editor:focus { outline: none; border-color: #3c4356; }
  #editor::placeholder { color: var(--faint); }

  /* ---------- photos ---------- */

  #photos {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 12px;
  }
  #photos:empty { display: none; }

  .thumb {
    position: relative;
    aspect-ratio: 1;
    border-radius: 10px;
    overflow: hidden;
    background: var(--panel-2);
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb.pending::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(20, 22, 27, 0.45);
  }
  .thumb .rm {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: rgba(0, 0, 0, 0.62);
    color: #fff;
    font-size: 0.9rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .actions { display: flex; gap: 8px; margin-top: 12px; }

  .action {
    flex: 1 1 auto;
    padding: 12px;
    font-size: 0.9rem;
    font-weight: 500;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text);
    cursor: pointer;
    text-align: center;
  }
  .action:active { background: var(--panel-2); }
  #file { display: none; }

  /* Deliberately low-emphasis: destructive, and you should have to look for it. */
  .danger-link {
    display: block;
    margin: 14px auto 0;
    padding: 8px 14px;
    background: none;
    border: none;
    font: inherit;
    font-size: 0.8rem;
    color: var(--faint);
    cursor: pointer;
  }
  .danger-link:active { color: var(--danger); }
  .danger-link[hidden] { display: none; }

  /* ---------- past entries ---------- */

  .past-head {
    margin: 28px 0 10px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--faint);
  }

  .past-item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    width: 100%;
    text-align: left;
    padding: 12px;
    margin-bottom: 8px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text);
    cursor: pointer;
    font: inherit;
  }
  .past-item.current { border-color: var(--accent); }
  .past-item .pi-body { flex: 1 1 auto; min-width: 0; }
  .past-item .pi-date { font-size: 0.78rem; color: var(--accent); margin-bottom: 3px; }
  .past-item .pi-text {
    font-size: 0.88rem;
    color: var(--dim);
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .past-item .pi-count {
    flex: 0 0 auto;
    font-size: 0.72rem;
    color: var(--faint);
    padding-top: 2px;
  }
  .past-empty { color: var(--faint); font-size: 0.85rem; padding: 4px 2px; }

  /* ---------- lightbox ---------- */

  #lightbox {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: rgba(8, 9, 12, 0.94);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #lightbox.show { display: flex; }
  #lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }

  /* ---------- toast ---------- */

  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(var(--safe-bottom) + 20px);
    transform: translate(-50%, 20px);
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 0.85rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s, transform 0.18s;
    z-index: 80;
    max-width: 88vw;
    text-align: center;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (min-width: 640px) {
    header { padding-left: 0; padding-right: 0; }
    header > * { max-width: 620px; margin-left: auto; margin-right: auto; }
    main { max-width: 620px; margin: 0 auto; width: 100%; }
  }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <h1>Journal</h1>
    <p>Enter the passphrase to unlock. It's stored on this device so you only do this once.</p>
    <input id="gate-input" type="password" autocomplete="current-password" placeholder="Passphrase" enterkeyhint="go">
    <button id="gate-go">Unlock</button>
    <div id="gate-error"></div>
  </div>
</div>

<div id="app">
  <header>
    <div class="datebar">
      <button class="navbtn" id="prev" aria-label="Previous day">‹</button>
      <div class="datelabel">
        <div class="d1"><span id="date-main">Today</span><span class="caret">▾</span></div>
        <div class="d2" id="date-sub"></div>
        <input type="date" id="date-picker" aria-label="Jump to a date">
      </div>
      <button class="navbtn" id="next" aria-label="Next day">›</button>
    </div>
    <div class="statusrow">
      <span class="dot" id="dot"></span>
      <span id="status">Loading…</span>
      <button class="today-chip" id="today" hidden>Today</button>
    </div>
  </header>

  <main>
    <div class="grow-wrap" id="grow" data-value="">
      <textarea id="editor" placeholder="What did you get up to?" enterkeyhint="enter"></textarea>
    </div>
    <div id="photos"></div>
    <div class="actions">
      <button class="action" id="add-photo">Add photo</button>
    </div>
    <button class="danger-link" id="delete-day" hidden>Delete this day</button>
    <input type="file" id="file" accept="image/*" multiple>

    <div class="past-head">Recent</div>
    <div id="past"></div>
  </main>
</div>

<div id="lightbox"><img id="lightbox-img" alt=""></div>
<div id="toast"></div>

<script>
(function () {
  'use strict';

  // -------------------------------------------------------------------------
  // Config
  // -------------------------------------------------------------------------

  var API = '/api/journal';
  var TOKEN_KEY = 'journal.token';
  var PULLED_KEY = 'journal.lastPull';
  var MAX_DIM = 1600;          // longest edge after downscale
  var JPEG_QUALITY = 0.82;
  var LOCAL_SAVE_MS = 350;     // debounce: keystroke -> IndexedDB
  var SYNC_MS = 2000;          // debounce: IndexedDB -> server
  var RECENT_LIMIT = 30;

  var token = null;
  var db = null;
  var currentDate = todayStr();
  var objectUrls = new Map();  // photoId -> blob: URL
  var syncTimer = null;
  var saveTimer = null;
  var syncing = false;
  var syncQueued = false;
  var photosWaiting = 0;       // uploads still owed to the server

  // -------------------------------------------------------------------------
  // Dates. Everything is local time — a journal day is the day you lived,
  // not a UTC window.
  // -------------------------------------------------------------------------

  function todayStr() { return toStr(new Date()); }

  function toStr(d) {
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }

  function fromStr(s) {
    var p = s.split('-');
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }

  function shiftDate(s, days) {
    var d = fromStr(s);
    d.setDate(d.getDate() + days);
    return toStr(d);
  }

  function prettyDate(s) {
    var d = fromStr(s);
    var t = todayStr();
    if (s === t) return 'Today';
    if (s === shiftDate(t, -1)) return 'Yesterday';
    var opts = { weekday: 'short', month: 'short', day: 'numeric' };
    if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
    return d.toLocaleDateString(undefined, opts);
  }

  function longDate(s) {
    return fromStr(s).toLocaleDateString(undefined, {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });
  }

  // -------------------------------------------------------------------------
  // IndexedDB. Entries and photo blobs both live here; the server is a mirror,
  // not the source of truth, so the app works with no signal.
  // -------------------------------------------------------------------------

  function openDb() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open('journal', 1);
      req.onupgradeneeded = function (e) {
        var d = e.target.result;
        if (!d.objectStoreNames.contains('entries')) {
          d.createObjectStore('entries', { keyPath: 'date' });
        }
        if (!d.objectStoreNames.contains('photos')) {
          d.createObjectStore('photos', { keyPath: 'id' });
        }
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function tx(store, mode, fn) {
    return new Promise(function (resolve, reject) {
      var t = db.transaction(store, mode);
      var req = fn(t.objectStore(store));
      t.onerror = function () { reject(t.error); };
      if (req) {
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error); };
      } else {
        t.oncomplete = function () { resolve(); };
      }
    });
  }

  var idbGet = function (s, k) { return tx(s, 'readonly', function (o) { return o.get(k); }); };
  var idbAll = function (s) { return tx(s, 'readonly', function (o) { return o.getAll(); }); };
  var idbPut = function (s, v) { return tx(s, 'readwrite', function (o) { return o.put(v); }); };
  var idbDel = function (s, k) { return tx(s, 'readwrite', function (o) { return o.delete(k); }); };

  // -------------------------------------------------------------------------
  // API
  // -------------------------------------------------------------------------

  function api(path, opts) {
    opts = opts || {};
    var headers = opts.headers || {};
    headers['Authorization'] = 'Bearer ' + token;
    return fetch(API + path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body,
      cache: 'no-store'
    }).then(function (res) {
      if (res.status === 401) {
        var err = new Error('unauthorized');
        err.unauthorized = true;
        throw err;
      }
      if (!res.ok) {
        var httpErr = new Error('HTTP ' + res.status);
        httpErr.status = res.status;
        throw httpErr;
      }
      return res;
    });
  }

  // A 4xx means this request will never succeed as-is, so retrying it forever
  // just wedges the queue. Timeouts and rate limits are worth another go.
  function permanentFailure(err) {
    var s = err && err.status;
    return typeof s === 'number' && s >= 400 && s < 500 && s !== 408 && s !== 429;
  }

  // -------------------------------------------------------------------------
  // Entry read / write
  // -------------------------------------------------------------------------

  function blankEntry(date) {
    return { date: date, text: '', photos: [], updatedAt: 0, dirty: false, deleted: false };
  }

  function getEntry(date) {
    return idbGet('entries', date).then(function (e) { return e || blankEntry(date); });
  }

  // Writes locally and marks dirty. The server push is debounced separately so
  // typing never waits on the network.
  function saveEntry(entry) {
    entry.updatedAt = Date.now();
    entry.dirty = true;
    return idbPut('entries', entry).then(function () {
      scheduleSync();
      renderPast();
      if (entry.date === currentDate) refreshDayControls(entry);
    });
  }

  // -------------------------------------------------------------------------
  // Sync. Push dirty entries and un-uploaded photos, then pull anything the
  // server has that's newer. Last-write-wins on updatedAt.
  // -------------------------------------------------------------------------

  function scheduleSync() {
    clearTimeout(syncTimer);
    syncTimer = setTimeout(function () { sync(); }, SYNC_MS);
  }

  function sync() {
    if (syncing) { syncQueued = true; return Promise.resolve(); }
    if (!navigator.onLine) { setStatus('off', 'Offline — saved on this device'); return Promise.resolve(); }

    syncing = true;
    setStatus('busy', 'Syncing…');

    return pushPhotos()
      .then(pushEntries)
      .then(pull)
      .then(function () {
        if (photosWaiting) {
          setStatus('busy', photosWaiting === 1
            ? 'Synced — 1 photo still uploading'
            : 'Synced — ' + photosWaiting + ' photos still uploading');
        } else {
          setStatus('ok', 'Synced');
        }
      })
      .catch(function (err) {
        if (err && err.unauthorized) {
          lock();
          return;
        }
        setStatus('off', navigator.onLine ? 'Sync failed — saved on this device' : 'Offline — saved on this device');
      })
      .then(function () {
        syncing = false;
        if (syncQueued) { syncQueued = false; scheduleSync(); }
      });
  }

  // Photo failures are isolated per photo and never abort the pass: entries are
  // the irreplaceable part, and they push after this. A photo the server keeps
  // rejecting (too large, storage not enabled) is parked rather than retried
  // forever, which would wedge every later sync behind it.
  function pushPhotos() {
    return idbAll('photos').then(function (all) {
      var pending = all.filter(function (p) { return !p.uploaded && !p.failed; });
      var parked = 0;
      return pending.reduce(function (chain, p) {
        return chain.then(function () {
          return api('/photos/' + p.id, {
            method: 'PUT',
            headers: { 'Content-Type': p.type || 'image/jpeg' },
            body: p.blob
          }).then(function () {
            p.uploaded = true;
            return idbPut('photos', p);
          }).catch(function (err) {
            if (err && err.unauthorized) throw err;
            if (!permanentFailure(err)) return;   // offline or server blip — try again later
            p.failed = true;
            parked++;
            return idbPut('photos', p);
          });
        });
      }, Promise.resolve()).then(function () {
        if (parked) {
          toast(parked === 1
            ? "A photo couldn't be uploaded — it's still on this device"
            : parked + " photos couldn't be uploaded — they're still on this device");
        }
        return idbAll('photos');
      }).then(function (after) {
        photosWaiting = after.filter(function (p) { return !p.uploaded && !p.failed; }).length;
      });
    });
  }

  function pushEntries() {
    return idbAll('entries').then(function (all) {
      var dirty = all.filter(function (e) { return e.dirty; });
      return dirty.reduce(function (chain, e) {
        return chain.then(function () {
          return api('/entries/' + e.date, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: e.text, photos: e.photos, deleted: !!e.deleted })
          }).then(function (res) { return res.json(); })
            .then(function (stored) {
              // Re-read: the entry may have changed while the request was in
              // flight, in which case it's still dirty and must not be cleared.
              return idbGet('entries', e.date).then(function (fresh) {
                if (!fresh || fresh.updatedAt !== e.updatedAt) return;
                fresh.dirty = false;
                fresh.updatedAt = stored.updatedAt;
                return idbPut('entries', fresh);
              });
            });
        });
      }, Promise.resolve());
    });
  }

  function pull() {
    var since = Number(localStorage.getItem(PULLED_KEY)) || 0;
    var startedAt = Date.now();
    return api('/entries?since=' + since)
      .then(function (res) { return res.json(); })
      .then(function (data) {
        var remote = data.entries || [];
        return remote.reduce(function (chain, r) {
          return chain.then(function () {
            return idbGet('entries', r.date).then(function (local) {
              // A local edit that hasn't been pushed yet always wins; it'll go
              // up on the next push and become the newer copy anyway.
              if (local && local.dirty) return;
              if (local && (local.updatedAt || 0) >= (r.updatedAt || 0)) return;
              return idbPut('entries', {
                date: r.date,
                text: r.text || '',
                photos: r.photos || [],
                updatedAt: r.updatedAt || 0,
                deleted: !!r.deleted,
                dirty: false
              });
            });
          });
        }, Promise.resolve()).then(function () {
          // Cursor comes from the server's clock (data.now), not this device's.
          // startedAt is only a fallback for an older Worker that omits it.
          localStorage.setItem(PULLED_KEY, String(data.now || startedAt));
          if (remote.length) { renderPast(); refreshIfCurrent(remote); }
        });
      });
  }

  // Re-render the open day when the server had something newer for it — but
  // never at the cost of keystrokes. The local write is debounced behind the
  // typing, so a sync landing in that gap would re-read the older stored text
  // and wipe what's on screen. Blurring the field doesn't flush that pending
  // write, so checking activeElement alone isn't enough.
  function refreshIfCurrent(remote) {
    if (saveTimer) return;
    if (document.activeElement === editor) return;
    if (!remote.some(function (r) { return r.date === currentDate; })) return;
    return idbGet('entries', currentDate).then(function (local) {
      if (local && local.dirty) return;   // our copy is ahead of the server's
      return loadDay(currentDate);
    });
  }

  // -------------------------------------------------------------------------
  // Photos
  // -------------------------------------------------------------------------

  // Phone photos are 3-5MB and hundreds of times larger than they need to be
  // for a journal thumbnail. Downscale before anything touches storage.
  function downscale(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth;
        var h = img.naturalHeight;
        var scale = Math.min(1, MAX_DIM / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale));
        var ch = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement('canvas');
        canvas.width = cw;
        canvas.height = ch;
        canvas.getContext('2d').drawImage(img, 0, 0, cw, ch);
        URL.revokeObjectURL(url);
        canvas.toBlob(function (blob) {
          if (blob) resolve(blob);
          else reject(new Error('encode failed'));
        }, 'image/jpeg', JPEG_QUALITY);
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('decode failed'));
      };
      img.src = url;
    });
  }

  function addPhotos(files) {
    var list = Array.prototype.slice.call(files);
    if (!list.length) return;
    toast(list.length === 1 ? 'Adding photo…' : 'Adding ' + list.length + ' photos…');

    getEntry(currentDate).then(function (entry) {
      return list.reduce(function (chain, file) {
        return chain.then(function () {
          return downscale(file).then(function (blob) {
            var id = uuid();
            return idbPut('photos', {
              id: id, blob: blob, type: 'image/jpeg', uploaded: false
            }).then(function () {
              entry.photos.push(id);
            });
          });
        }).catch(function () {
          toast("Couldn't read one of those images");
        });
      }, Promise.resolve()).then(function () {
        return saveEntry(entry);
      }).then(function () {
        return renderPhotos(entry.photos);
      });
    });
  }

  // Drops a photo's bytes from this device and the server. The entry that
  // referenced it must already have been updated.
  function purgePhoto(id) {
    revokeUrl(id);
    return idbDel('photos', id).then(function () {
      return api('/photos/' + id, { method: 'DELETE' }).catch(function () {});
    });
  }

  function removePhoto(id) {
    getEntry(currentDate).then(function (entry) {
      entry.photos = entry.photos.filter(function (p) { return p !== id; });
      return saveEntry(entry).then(function () {
        return renderPhotos(entry.photos);
      }).then(function () {
        return purgePhoto(id);
      });
    });
  }

  function deleteDay() {
    var date = currentDate;
    getEntry(date).then(function (entry) {
      if (!entry.text.trim() && !entry.photos.length) return;

      var what = entry.photos.length
        ? 'The text and ' + (entry.photos.length === 1 ? 'its photo' : entry.photos.length + ' photos')
        : 'The text';
      if (!window.confirm(
        'Delete ' + prettyDate(date) + '?\n\n' + what +
        ' will be removed from this device and the server. This cannot be undone.'
      )) return;

      var photoIds = entry.photos.slice();
      entry.text = '';
      entry.photos = [];
      entry.deleted = true;

      return saveEntry(entry).then(function () {
        return photoIds.reduce(function (chain, id) {
          return chain.then(function () { return purgePhoto(id); });
        }, Promise.resolve());
      }).then(function () {
        return loadDay(date);
      }).then(function () {
        toast('Deleted');
      });
    });
  }

  // Returns a blob: URL for a photo, fetching from the server the first time
  // this device sees a photo taken on another one.
  function photoUrl(id) {
    if (objectUrls.has(id)) return Promise.resolve(objectUrls.get(id));
    return idbGet('photos', id).then(function (p) {
      if (p && p.blob) return p.blob;
      return api('/photos/' + id).then(function (res) { return res.blob(); })
        .then(function (blob) {
          return idbPut('photos', { id: id, blob: blob, type: blob.type, uploaded: true })
            .then(function () { return blob; });
        });
    }).then(function (blob) {
      var url = URL.createObjectURL(blob);
      objectUrls.set(id, url);
      return url;
    });
  }

  function revokeUrl(id) {
    if (objectUrls.has(id)) {
      URL.revokeObjectURL(objectUrls.get(id));
      objectUrls.delete(id);
    }
  }

  function uuid() {
    if (crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = (Math.random() * 16) | 0;
      return (c === 'x' ? r : ((r & 0x3) | 0x8)).toString(16);
    });
  }

  // -------------------------------------------------------------------------
  // Rendering
  // -------------------------------------------------------------------------

  var gate = document.getElementById('gate');
  var gateInput = document.getElementById('gate-input');
  var gateGo = document.getElementById('gate-go');
  var gateError = document.getElementById('gate-error');
  var app = document.getElementById('app');
  var editor = document.getElementById('editor');
  var growWrap = document.getElementById('grow');
  var photosEl = document.getElementById('photos');
  var pastEl = document.getElementById('past');
  var dateMain = document.getElementById('date-main');
  var dateSub = document.getElementById('date-sub');
  var statusEl = document.getElementById('status');
  var dotEl = document.getElementById('dot');
  var fileInput = document.getElementById('file');
  var nextBtn = document.getElementById('next');
  var datePicker = document.getElementById('date-picker');
  var todayChip = document.getElementById('today');
  var deleteBtn = document.getElementById('delete-day');
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightbox-img');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function setStatus(kind, msg) {
    dotEl.className = 'dot' + (kind ? ' ' + kind : '');
    statusEl.textContent = msg;
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  // Feeds the CSS mirror in .grow-wrap; the grid does the actual sizing.
  function autosize() {
    growWrap.dataset.value = editor.value;
  }

  // "Today" only when you're away from it; delete only when there's something
  // to delete.
  function refreshDayControls(entry) {
    todayChip.hidden = currentDate === todayStr();
    deleteBtn.hidden = !(entry.text.trim() || entry.photos.length) || entry.deleted;
  }

  function loadDay(date) {
    currentDate = date;
    dateMain.textContent = prettyDate(date);
    dateSub.textContent = longDate(date);
    // Re-stamped every load so the ceiling is still right if the app has been
    // sitting open since before midnight.
    datePicker.max = todayStr();
    datePicker.value = date;
    nextBtn.disabled = date >= todayStr();

    return getEntry(date).then(function (entry) {
      editor.value = entry.deleted ? '' : (entry.text || '');
      autosize();
      refreshDayControls(entry);
      renderPast();
      return renderPhotos(entry.deleted ? [] : entry.photos);
    });
  }

  function renderPhotos(ids) {
    photosEl.innerHTML = '';
    if (!ids || !ids.length) return Promise.resolve();

    return ids.reduce(function (chain, id) {
      return chain.then(function () {
        var wrap = document.createElement('div');
        wrap.className = 'thumb pending';
        var img = document.createElement('img');
        img.alt = '';
        var rm = document.createElement('button');
        rm.className = 'rm';
        rm.textContent = '×';
        rm.setAttribute('aria-label', 'Remove photo');
        rm.addEventListener('click', function (e) {
          e.stopPropagation();
          // The x sits right on the photo you're trying to tap open, and the
          // delete is immediate and server-side. Worth a confirm.
          if (!window.confirm('Remove this photo?\n\nIt will be deleted from this device and the server. This cannot be undone.')) return;
          removePhoto(id);
        });
        wrap.appendChild(img);
        wrap.appendChild(rm);
        wrap.addEventListener('click', function () {
          if (!img.src) return;
          lightboxImg.src = img.src;
          lightbox.classList.add('show');
        });
        photosEl.appendChild(wrap);

        return photoUrl(id).then(function (url) {
          img.src = url;
          wrap.classList.remove('pending');
        }).catch(function () {
          wrap.classList.remove('pending');
          wrap.style.background = 'var(--panel-2)';
        });
      });
    }, Promise.resolve());
  }

  function renderPast() {
    return idbAll('entries').then(function (all) {
      var items = all
        .filter(function (e) { return !e.deleted && (e.text.trim() || e.photos.length); })
        .sort(function (a, b) { return a.date < b.date ? 1 : -1; })
        .slice(0, RECENT_LIMIT);

      pastEl.innerHTML = '';
      if (!items.length) {
        var empty = document.createElement('div');
        empty.className = 'past-empty';
        empty.textContent = 'Nothing yet. Write today’s first.';
        pastEl.appendChild(empty);
        return;
      }

      items.forEach(function (e) {
        var btn = document.createElement('button');
        btn.className = 'past-item' + (e.date === currentDate ? ' current' : '');

        var body = document.createElement('div');
        body.className = 'pi-body';

        var d = document.createElement('div');
        d.className = 'pi-date';
        d.textContent = prettyDate(e.date);

        var t = document.createElement('div');
        t.className = 'pi-text';
        t.textContent = e.text.trim() || (e.photos.length === 1 ? '1 photo' : e.photos.length + ' photos');

        body.appendChild(d);
        body.appendChild(t);
        btn.appendChild(body);

        if (e.photos.length && e.text.trim()) {
          var c = document.createElement('div');
          c.className = 'pi-count';
          c.textContent = '📷 ' + e.photos.length;
          btn.appendChild(c);
        }

        btn.addEventListener('click', function () {
          loadDay(e.date);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        pastEl.appendChild(btn);
      });
    });
  }

  // -------------------------------------------------------------------------
  // Gate
  // -------------------------------------------------------------------------

  function unlock(candidate) {
    gateError.textContent = '';
    gateGo.textContent = 'Checking…';
    token = candidate;
    return api('/entries?since=' + Date.now())
      .then(function () {
        localStorage.setItem(TOKEN_KEY, candidate);
        gate.classList.add('hidden');
        app.classList.add('ready');
        return start();
      })
      .catch(function (err) {
        token = null;
        gateGo.textContent = 'Unlock';
        gateError.textContent = err && err.unauthorized
          ? 'Wrong passphrase.'
          : 'Could not reach the server.';
      });
  }

  function lock() {
    localStorage.removeItem(TOKEN_KEY);
    token = null;
    app.classList.remove('ready');
    gate.classList.remove('hidden');
    gateGo.textContent = 'Unlock';
    gateError.textContent = 'Session expired — enter the passphrase again.';
  }

  gateGo.addEventListener('click', function () {
    var v = gateInput.value.trim();
    if (v) unlock(v);
  });
  gateInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') gateGo.click();
  });

  // -------------------------------------------------------------------------
  // Wiring
  // -------------------------------------------------------------------------

  editor.addEventListener('input', function () {
    autosize();
    var text = editor.value;
    var date = currentDate;
    setStatus('busy', 'Saving…');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      saveTimer = null;
      getEntry(date).then(function (entry) {
        entry.text = text;
        entry.deleted = false;
        return saveEntry(entry);
      }).then(function () {
        setStatus('ok', 'Saved on this device');
      });
    }, LOCAL_SAVE_MS);
  });

  datePicker.addEventListener('change', function () {
    if (!datePicker.value) return;
    var picked = datePicker.value > todayStr() ? todayStr() : datePicker.value;
    loadDay(picked);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  document.getElementById('prev').addEventListener('click', function () {
    loadDay(shiftDate(currentDate, -1));
  });
  nextBtn.addEventListener('click', function () {
    if (currentDate < todayStr()) loadDay(shiftDate(currentDate, 1));
  });
  todayChip.addEventListener('click', function () {
    loadDay(todayStr());
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  deleteBtn.addEventListener('click', deleteDay);

  document.getElementById('add-photo').addEventListener('click', function () {
    fileInput.click();
  });
  fileInput.addEventListener('change', function () {
    addPhotos(fileInput.files);
    fileInput.value = '';
  });

  lightbox.addEventListener('click', function () {
    lightbox.classList.remove('show');
    lightboxImg.src = '';
  });

  window.addEventListener('online', function () { scheduleSync(); });
  window.addEventListener('offline', function () {
    setStatus('off', 'Offline — saved on this device');
  });

  // Flush before the app is backgrounded — on iOS a suspended tab may never
  // get another timer callback.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') {
      clearTimeout(saveTimer);
      clearTimeout(syncTimer);
      var text = editor.value;
      var date = currentDate;
      getEntry(date).then(function (entry) {
        if (entry.text === text) return;
        entry.text = text;
        entry.deleted = false;
        return saveEntry(entry);
      });
    } else {
      scheduleSync();
    }
  });

  // -------------------------------------------------------------------------
  // Boot
  // -------------------------------------------------------------------------

  function start() {
    // Ask the browser not to evict us. Granted on installed home-screen apps;
    // harmless no-op elsewhere.
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(function () {});
    }
    return loadDay(todayStr()).then(function () {
      setStatus('', 'Ready');
      return sync();
    });
  }

  openDb().then(function (d) {
    db = d;
    var saved = localStorage.getItem(TOKEN_KEY);
    if (saved) {
      token = saved;
      gate.classList.add('hidden');
      app.classList.add('ready');
      return start();
    }
    gateInput.focus();
  }).catch(function () {
    document.body.innerHTML =
      '<div style="padding:40px;text-align:center;color:#9aa2b4;font-family:system-ui">' +
      'This browser blocked local storage, so the journal can’t run. ' +
      'Private browsing mode is the usual cause.</div>';
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
