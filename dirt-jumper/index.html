    <header id="bar"><a href="../arcade/">← THE ARCADE</a><span>LIMESTONE GAMES</span></header>

    <script src="js/config.js?v=20260917b"></script>
    <script src="js/Terrain.js?v=20260917b"></script>
    <script src="js/Bike.js?v=20260917b"></script>

    <script src="js/CrashRig.js?v=20260917b"></script>
    <script src="js/RideScene.js?v=20260917b"></script>
    <script>
        const phaserConfig = {
            type: Phaser.AUTO,
            render: { antialias: true, mipmapFilter: 'LINEAR_MIPMAP_LINEAR' },
            width: CONFIG.WIDTH,
            height: CONFIG.HEIGHT,
            parent: 'game-container',
            backgroundColor: '#3a5a72',
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH
            },
            scene: [RideScene],
            input: {
                keyboard: {
                    capture: [
                        Phaser.Input.Keyboard.KeyCodes.UP,
                        Phaser.Input.Keyboard.KeyCodes.DOWN,
                        Phaser.Input.Keyboard.KeyCodes.LEFT,
                        Phaser.Input.Keyboard.KeyCodes.RIGHT,
                        Phaser.Input.Keyboard.KeyCodes.SPACE,
                        Phaser.Input.Keyboard.KeyCodes.ENTER,
                        Phaser.Input.Keyboard.KeyCodes.S,
                        Phaser.Input.Keyboard.KeyCodes.Z,
                        Phaser.Input.Keyboard.KeyCodes.X,
                        Phaser.Input.Keyboard.KeyCodes.C,
                        Phaser.Input.Keyboard.KeyCodes.A,
                        Phaser.Input.Keyboard.KeyCodes.D,
                        Phaser.Input.Keyboard.KeyCodes.P,
                        Phaser.Input.Keyboard.KeyCodes.R,
                        Phaser.Input.Keyboard.KeyCodes.M,
                        Phaser.Input.Keyboard.KeyCodes.ESC
                    ]
                }
            }
        };

        // top-level `game` is reachable as a bare global for the verification eval.
        const game = new Phaser.Game(phaserConfig);
        window.game = game;
    </script>
