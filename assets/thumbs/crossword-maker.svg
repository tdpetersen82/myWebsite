<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Crossword Maker board">
  <defs>
    <linearGradient id="cmbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF4E6"/>
      <stop offset="1" stop-color="#EFE0C6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#cmbg)"/>
  <!-- criss-cross: WORD across, CROSS down, sharing the R -->
  <g stroke="#2A2017" stroke-width="4">
    <!-- CROSS (down, col 2) -->
    <rect x="303" y="38"  width="100" height="100" rx="10" fill="#FFFFFF"/>
    <rect x="303" y="144" width="100" height="100" rx="10" fill="#CBD9EB"/>
    <rect x="303" y="250" width="100" height="100" rx="10" fill="#FFFFFF"/>
    <rect x="303" y="356" width="100" height="100" rx="10" fill="#FFFFFF"/>
    <rect x="303" y="462" width="100" height="100" rx="10" fill="#FFFFFF"/>
    <!-- WORD (across, row 1) -->
    <rect x="91"  y="144" width="100" height="100" rx="10" fill="#E3EBF5"/>
    <rect x="197" y="144" width="100" height="100" rx="10" fill="#E3EBF5"/>
    <rect x="409" y="144" width="100" height="100" rx="10" fill="#E3EBF5"/>
  </g>
  <g font-family="'Bricolage Grotesque','Inter',sans-serif" font-weight="800" font-size="58" text-anchor="middle" fill="#2A2017">
    <text x="353" y="108">C</text>
    <text x="353" y="214">R</text>
    <text x="353" y="320">O</text>
    <text x="353" y="426">S</text>
    <text x="353" y="532">S</text>
    <text x="141" y="214">W</text>
    <text x="247" y="214">O</text>
    <text x="459" y="214">D</text>
  </g>
  <g font-family="'JetBrains Mono','Inter',monospace" font-weight="700" font-size="26" fill="#3D5A80">
    <text x="313" y="66">1</text>
    <text x="101" y="172">2</text>
  </g>
</svg>
