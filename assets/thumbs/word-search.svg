<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Word Search board">
  <defs>
    <linearGradient id="wswood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9C6C3B"/>
      <stop offset="0.5" stop-color="#835830"/>
      <stop offset="1" stop-color="#6B4624"/>
    </linearGradient>
    <linearGradient id="wssheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFEBC7" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#FFEBC7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- wooden table -->
  <rect width="600" height="600" fill="url(#wswood)"/>
  <rect width="600" height="600" fill="url(#wssheen)"/>
  <!-- paper board -->
  <rect x="46" y="50" width="508" height="508" rx="26" fill="#2A1A0C" opacity="0.35"/>
  <rect x="40" y="40" width="508" height="508" rx="26" fill="#FFFDF8" stroke="#4A3018" stroke-width="5"/>
  <!-- gridlines -->
  <g stroke="#2A2017" stroke-opacity="0.10" stroke-width="2">
    <path d="M141.6 40 V548 M243.2 40 V548 M344.8 40 V548 M446.4 40 V548"/>
    <path d="M40 141.6 H548 M40 243.2 H548 M40 344.8 H548 M40 446.4 H548"/>
  </g>
  <!-- found-word highlights: FIND across (amber), WORD down (green) -->
  <rect x="52" y="55" width="384" height="78" rx="39" fill="#FFD9A0"/>
  <rect x="459" y="55" width="78" height="380" rx="39" fill="#A8E0C8"/>
  <!-- diagonal selection in progress (accent) -->
  <rect x="153.4" y="237.6" width="78" height="316" rx="39" fill="#C96F2A" opacity="0.38" transform="rotate(45 192.4 395.6)"/>
  <g font-family="'Bricolage Grotesque','Inter',sans-serif" font-weight="800" font-size="64" text-anchor="middle">
    <!-- row 0: F I N D | W -->
    <text x="90.8" y="116" fill="#2A2017">F</text><text x="192.4" y="116" fill="#2A2017">I</text><text x="294" y="116" fill="#2A2017">N</text><text x="395.6" y="116" fill="#2A2017">D</text><text x="497.2" y="116" fill="#2A2017">W</text>
    <!-- row 1 -->
    <text x="90.8" y="217.6" fill="#B49A75">A</text><text x="192.4" y="217.6" fill="#B49A75">E</text><text x="294" y="217.6" fill="#B49A75">U</text><text x="395.6" y="217.6" fill="#B49A75">Q</text><text x="497.2" y="217.6" fill="#2A2017">O</text>
    <!-- row 2 -->
    <text x="90.8" y="319.2" fill="#B49A75">B</text><text x="192.4" y="319.2" fill="#B49A75">C</text><text x="294" y="319.2" fill="#2A2017">Y</text><text x="395.6" y="319.2" fill="#B49A75">T</text><text x="497.2" y="319.2" fill="#2A2017">R</text>
    <!-- row 3 -->
    <text x="90.8" y="420.8" fill="#B49A75">K</text><text x="192.4" y="420.8" fill="#2A2017">O</text><text x="294" y="420.8" fill="#B49A75">S</text><text x="395.6" y="420.8" fill="#B49A75">M</text><text x="497.2" y="420.8" fill="#2A2017">D</text>
    <!-- row 4 -->
    <text x="90.8" y="522.4" fill="#2A2017">U</text><text x="192.4" y="522.4" fill="#B49A75">L</text><text x="294" y="522.4" fill="#B49A75">E</text><text x="395.6" y="522.4" fill="#B49A75">P</text><text x="497.2" y="522.4" fill="#B49A75">A</text>
  </g>
</svg>
