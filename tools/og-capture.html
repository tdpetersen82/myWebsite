<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>og capture</title>
<!-- Renders one printable's .sheet, scaled to fit a 1200x630 OG card, for a
     headless-Chrome screenshot. Driven by tools/make-printable-og.sh; never
     deployed (tools/ is in .assetsignore). Usage: og-capture.html?slug=X -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../category.css">
<link rel="stylesheet" href="../printables/printables.css?v=20260825b">
<style>
  html, body { margin: 0; padding: 0; width: 1200px; height: 630px; overflow: hidden; }
  #stage {
    position: relative; width: 1200px; height: 630px;
    display: flex; align-items: center; justify-content: center;
  }
  /* The sheet renders at its natural 816px (8.5in) width inside a wrapper,
     then the wrapper is transform-scaled to fit the card. Chrome rasterises
     at the final size, so the text stays crisp. */
  #holder { width: 816px; flex: none; }
  #holder .sheet { margin: 0; box-shadow: 0 18px 45px -18px rgba(20,17,13,.5); }
</style>
</head>
<body class="cat-root pr-root">
<div id="stage"><div id="holder"></div></div>
<script>
(async () => {
  const slug = new URLSearchParams(location.search).get('slug');
  const res = await fetch(`../printables/${slug}/`);
  const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
  const sheet = doc.querySelector('.sheet');
  document.getElementById('holder').appendChild(sheet);
  await document.fonts.ready;
  // Fit: cap the scale so short sheets don't blow up past the card.
  const holder = document.getElementById('holder');
  const h = holder.getBoundingClientRect().height;
  const scale = Math.min(590 / h, 1120 / 816, 0.9);
  holder.style.transform = `scale(${scale})`;
  document.title = 'ready';
})();
</script>
</body>
</html>
