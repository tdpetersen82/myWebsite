<!doctype html><meta charset="utf-8"><title>Dynamine spell and machinery visual check</title>
<style>body{margin:0;background:#152126;color:#ffe1a2;font:14px system-ui;text-align:center}canvas{max-width:100%;height:auto}h1{font-size:20px}</style>
<h1>Dynamine · spell and machinery visual check</h1><canvas id="preview" width="800" height="620"></canvas>
<script type="module">
import {JARS} from '../dynamine/classic-content.mjs';
import {drawClassicPickup,drawFeatures,drawSpellEffects} from '../dynamine/classic-art.mjs';
const ctx=document.getElementById('preview').getContext('2d');
function draw(t){
 ctx.fillStyle='#152126';ctx.fillRect(0,0,800,620);
 const types=[...Object.keys(JARS),'bomb','fire','heart','max','radiation'];
 types.forEach((type,i)=>{const x=80+(i%5)*160,y=55+Math.floor(i/5)*105;ctx.save();ctx.translate(x,y);drawClassicPickup(ctx,type);ctx.restore();ctx.font='12px system-ui';ctx.fillStyle='#e1d8c7';ctx.textAlign='center';ctx.fillText(JARS[type]?.name||type,x,y+38);});
 const features=new Map(['spikes','barrier','conveyor','oneway','gate'].map((type,i)=>[7*13+1+i*2,{type,phase:0,dir:'right',turn:Math.floor(t/1000)%4}]));
 const g={time:t/1000,features,players:[],enemies:[],effects:[{effect:'electric',cells:[[2,9],[3,9]],until:1e9},{effect:'teleport',cells:[[5,9]],until:1e9},{effect:'wind',cells:[[7,9]],until:1e9}]};
 drawFeatures(ctx,g,56);drawSpellEffects(ctx,g,56);
 [...features].forEach(([k,f])=>{ctx.fillStyle='#e1d8c7';ctx.fillText(f.type,(k%13+.5)*56,466);});
 requestAnimationFrame(draw);
}requestAnimationFrame(draw);
</script>
